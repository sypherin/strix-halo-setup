<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PAC-MAN</title>
<style>
  :root {
    --bg: #000;
    --wall: #1919a6;
    --wall-glow: #2a2aff;
    --pac: #ffe000;
    --dot: #ffb897;
    --blinky: #ff0000;
    --pinky: #ffb8ff;
    --inky: #00ffff;
    --clyde: #ffb852;
    --fright: #2121de;
    --text: #fff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', monospace;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  #wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px;
  }
  #hud {
    width: 100%;
    max-width: 560px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
    text-shadow: 0 0 8px currentColor;
  }
  #hud .score { color: var(--pac); }
  #hud .hiscore { color: #fff; }
  #hud .level { color: var(--inky); }
  #stage {
    position: relative;
    width: 100%;
    max-width: 560px;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #000;
    border-radius: 4px;
    box-shadow: 0 0 24px rgba(41,41,255,0.35), inset 0 0 40px rgba(0,0,0,0.6);
  }
  #lives {
    position: absolute;
    left: 0;
    bottom: 2px;
    display: flex;
    gap: 6px;
    pointer-events: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(0,0,0,0.72);
    text-align: center;
    padding: 20px;
    z-index: 5;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: 40px;
    color: var(--pac);
    text-shadow: 0 0 16px var(--pac);
    letter-spacing: 3px;
  }
  #overlay p { font-size: 16px; line-height: 1.6; color: #ccc; }
  #overlay .big { font-size: 22px; color: #fff; }
  #overlay button {
    margin-top: 6px;
    font-family: inherit;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 2px;
    padding: 12px 28px;
    background: transparent;
    color: var(--pac);
    border: 2px solid var(--pac);
    border-radius: 8px;
    cursor: pointer;
    text-shadow: 0 0 8px var(--pac);
    box-shadow: 0 0 12px rgba(255,224,0,0.4);
  }
  #overlay button:active { background: rgba(255,224,0,0.15); }
  #hint { font-size: 12px; color: #666; letter-spacing: 1px; }
  /* D-pad for touch */
  #dpad {
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 4px;
    margin-top: 4px;
  }
  #dpad button {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
  }
  #dpad button:active { background: rgba(255,224,0,0.25); }
  #dpad .up { grid-column: 2; grid-row: 1; }
  #dpad .left { grid-column: 1; grid-row: 2; }
  #dpad .right { grid-column: 3; grid-row: 2; }
  #dpad .down { grid-column: 2; grid-row: 3; }
  @media (pointer: coarse) {
    #dpad { display: grid; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="score">SCORE <span id="score">0</span></div>
    <div class="hiscore">HI <span id="hiscore">0</span></div>
    <div class="level">LV <span id="level">1</span></div>
  </div>
  <div id="stage">
    <canvas id="game" width="560" height="620"></canvas>
    <div id="lives"></div>
    <div id="overlay">
      <h1>PAC-MAN</h1>
      <p class="big" id="ov-title">Eat all the dots. Avoid the ghosts.</p>
      <p id="ov-sub">Arrow keys / WASD to move.<br>Power pellets turn the tables.</p>
      <button id="startBtn">START</button>
    </div>
  </div>
  <div id="dpad">
    <button class="up" data-dir="up">&#9650;</button>
    <button class="left" data-dir="left">&#9664;</button>
    <button class="right" data-dir="right">&#9654;</button>
    <button class="down" data-dir="down">&#9660;</button>
  </div>
  <div id="hint">ARROWS / WASD &middot; P = PAUSE &middot; M = MUTE</div>
</div>
<script>
"use strict";
// ============================================================
//  PAC-MAN — single-file canvas game
// ============================================================

// ---- Maze layout (28 cols x 31 rows) ----
// # wall   . pellet   o power   - door   (space) empty path
const MAZE = [
  "############################",
  "#............##............#",
  "#.####.#####.##.#####.####.#",
  "#o####.#####.##.#####.####o#",
  "#.####.#####.##.#####.####.#",
  "#..........................#",
  "#.####.##.########.##.####.#",
  "#.####.##.########.##.####.#",
  "#......##....##....##......#",
  "######.##### ## #####.######",
  "######.##### ## #####.######",
  "######.##          ##.######",
  "######.## ###--### ##.######",
  "######.## #      # ##.######",
  "      .   #      #   .      ",
  "######.## #      # ##.######",
  "######.## ######## ##.######",
  "######.##          ##.######",
  "######.## ######## ##.######",
  "######.## ######## ##.######",
  "#............##............#",
  "#.####.#####.##.#####.####.#",
  "#.####.#####.##.#####.####.#",
  "#o..##.......  .......##..o#",
  "###.##.##.########.##.##.###",
  "###.##.##.########.##.##.###",
  "#......##....##....##......#",
  "#.##########.##.##########.#",
  "#.##########.##.##########.#",
  "#..........................#",
  "############################",
];

const COLS = 28;
const ROWS = 31;
const TILE = 20;
const W = COLS * TILE;   // 560
const H = ROWS * TILE;   // 620

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = W;
canvas.height = H;

// Cell types
const WALL = '#', DOT = '.', POWER = 'o', DOOR = '-', EMPTY = ' ';

// Canvas colors (canvas 2D does NOT support CSS var())
const C = {
  wall: '#2a2aff',
  wallDim: '#1919a6',
  dot: '#ffb897',
  pac: '#ffe000',
  fright: '#2121de',
  door: '#ffb8de',
};

// Working copy of the maze (dots get eaten)
let maze = [];

function resetMaze() {
  maze = MAZE.map(r => r.split(''));
}

// ---- Directions ----
const DIRS = {
  up:    { x: 0, y: -1 },
  down:  { x: 0, y: 1 },
  left:  { x: -1, y: 0 },
  right: { x: 1, y: 0 },
};
const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };
const DIR_KEYS = ['up', 'down', 'left', 'right'];

function tileAt(col, row) {
  if (row < 0 || row >= ROWS) return WALL;
  if (col < 0 || col >= COLS) return EMPTY; // tunnel wrap
  return maze[row][col];
}
function isWall(col, row) { return tileAt(col, row) === WALL; }
function isDoor(col, row) { return tileAt(col, row) === DOOR; }

// Can an entity at tile (col,row) step in direction d?
function canStep(col, row, d, isGhost, exitingHouse) {
  const nd = DIRS[d];
  const nc = col + nd.x;
  const nr = row + nd.y;
  if (nr < 0 || nr >= ROWS) return false;
  const t = tileAt(nc, nr);
  if (t === WALL) return false;
  if (t === DOOR) {
    // Only ghosts may use the door, and only when leaving/entering house
    return isGhost && exitingHouse;
  }
  return true;
}

// center pixel of a tile
function tileCenter(col, row) {
  return { x: col * TILE + TILE / 2, y: row * TILE + TILE / 2 };
}
// tile index of a pixel center
function tileOf(x, y) {
  return { col: Math.floor(x / TILE), row: Math.floor(y / TILE) };
}

// ---- Game state ----
const S = {
  state: 'menu',       // menu | ready | playing | dying | levelclear | gameover | paused
  score: 0,
  hiscore: 0,
  lives: 3,
  level: 1,
  dotsLeft: 0,
  frightTimer: 0,      // frames of frightened mode remaining
  ghostEatenChain: 0,  // 200/400/800/1600 chain
  frame: 0,
  muted: false,
  readyTimer: 0,
  deathTimer: 0,
  clearTimer: 0,
};

try { S.hiscore = parseInt(localStorage.getItem('pacman_hiscore') || '0', 10) || 0; } catch (e) {}

// ---- Entities ----
let pac = null;
let ghosts = [];

function makePac() {
  const c = tileCenter(13, 23);
  return {
    x: c.x, y: c.y,
    dir: 'left',
    nextDir: 'left',
    mouth: 0,
    mouthDir: 1,
    speed: 2.0,
    alive: true,
  };
}

const GHOST_DEFS = [
  { name: 'blinky', color: 'var(--blinky)', hex: '#ff0000', start: { col: 13, row: 11 }, inHouse: false },
  { name: 'pinky',  color: 'var(--pinky)',  hex: '#ffb8ff', start: { col: 13, row: 14 }, inHouse: true },
  { name: 'inky',   color: 'var(--inky)',   hex: '#00ffff', start: { col: 11, row: 14 }, inHouse: true },
  { name: 'clyde',  color: 'var(--clyde)',  hex: '#ffb852', start: { col: 15, row: 14 }, inHouse: true },
];

function makeGhosts() {
  return GHOST_DEFS.map((d, i) => {
    const c = tileCenter(d.start.col, d.start.row);
    return {
      name: d.name,
      hex: d.hex,
      x: c.x, y: c.y,
      dir: i === 0 ? 'left' : 'up',
      mode: d.inHouse ? 'house' : 'scatter', // house | scatter | chase | fright | eyes
      releaseTimer: d.inHouse ? (i * 40 + 30) : 0,
      bob: Math.random() * Math.PI * 2,
    };
  });
}

// Ghost house door tile
const DOOR_TILE = { col: 13, row: 12 };
const HOUSE_EXIT = { col: 13, row: 11 };

// ============================================================
//  INPUT
// ============================================================
const keyMap = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  w: 'up', s: 'down', a: 'left', d: 'right',
  W: 'up', S: 'down', A: 'left', D: 'right',
};

function setNextDir(d) {
  if (!pac) return;
  // allow immediate reverse even mid-tile
  if (d === OPPOSITE[pac.dir]) {
    pac.dir = d;
  }
  pac.nextDir = d;
}

window.addEventListener('keydown', (e) => {
  const d = keyMap[e.key];
  if (d) {
    e.preventDefault();
    setNextDir(d);
    return;
  }
  if (e.key === 'p' || e.key === 'P') togglePause();
  if (e.key === 'm' || e.key === 'M') S.muted = !S.muted;
  if (e.key === ' ' || e.key === 'Enter') {
    if (S.state === 'menu' || S.state === 'gameover') startGame();
  }
});

// D-pad
document.querySelectorAll('#dpad button').forEach(btn => {
  const d = btn.dataset.dir;
  const handler = (e) => { e.preventDefault(); setNextDir(d); };
  btn.addEventListener('touchstart', handler, { passive: false });
  btn.addEventListener('mousedown', handler);
});

document.getElementById('startBtn').addEventListener('click', startGame);

function togglePause() {
  if (S.state === 'playing') S.state = 'paused';
  else if (S.state === 'paused') S.state = 'playing';
}

// ============================================================
//  AUDIO (Web Audio API — tiny synth)
// ============================================================
let audioCtx = null;
function ac() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq, dur, type = 'square', vol = 0.06, slideTo = null) {
  if (S.muted) return;
  const a = ac();
  if (!a) return;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, a.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start();
  o.stop(a.currentTime + dur);
}
const sfx = {
  waka: () => { beep(440, 0.06, 'square', 0.05, 660); },
  power: () => { beep(200, 0.3, 'sawtooth', 0.06, 400); },
  eatGhost: () => { beep(300, 0.25, 'square', 0.07, 900); },
  death: () => { beep(600, 0.6, 'sawtooth', 0.08, 80); },
  extraLife: () => { beep(880, 0.15, 'square', 0.06, 1320); },
  start: () => { beep(523, 0.12, 'square', 0.06); setTimeout(() => beep(659, 0.12, 'square', 0.06), 130); setTimeout(() => beep(784, 0.2, 'square', 0.06), 260); },
};

// ============================================================
//  GAME FLOW
// ============================================================
function startGame() {
  S.score = 0;
  S.lives = 3;
  S.level = 1;
  S.state = 'ready';
  S.readyTimer = 90;
  resetMaze();
  countDots();
  pac = makePac();
  ghosts = makeGhosts();
  hideOverlay();
  updateHUD();
  sfx.start();
}

function countDots() {
  let n = 0;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (maze[r][c] === DOT || maze[r][c] === POWER) n++;
  S.dotsLeft = n;
}

function nextLevel() {
  S.level++;
  S.state = 'ready';
  S.readyTimer = 90;
  resetMaze();
  countDots();
  pac = makePac();
  ghosts = makeGhosts();
  updateHUD();
}

function loseLife() {
  S.lives--;
  S.state = 'dying';
  S.deathTimer = 120;
  sfx.death();
  updateHUD();
}

function afterDeath() {
  if (S.lives <= 0) {
    S.state = 'gameover';
    saveHiscore();
    showOverlay('GAME OVER', 'Final score: ' + S.score, 'PLAY AGAIN');
  } else {
    // reset positions, keep maze + score
    pac = makePac();
    ghosts = makeGhosts();
    S.frightTimer = 0;
    S.ghostEatenChain = 0;
    S.state = 'ready';
    S.readyTimer = 90;
    updateHUD();
  }
}

function levelClear() {
  S.state = 'levelclear';
  S.clearTimer = 120;
}

function saveHiscore() {
  if (S.score > S.hiscore) {
    S.hiscore = S.score;
    try { localStorage.setItem('pacman_hiscore', String(S.hiscore)); } catch (e) {}
  }
  updateHUD();
}

function updateHUD() {
  document.getElementById('score').textContent = S.score;
  document.getElementById('hiscore').textContent = S.hiscore;
  document.getElementById('level').textContent = S.level;
  renderLives();
}

function renderLives() {
  const el = document.getElementById('lives');
  el.innerHTML = '';
  for (let i = 0; i < Math.max(0, S.lives - 1); i++) {
    const s = document.createElement('span');
    s.style.cssText = 'width:16px;height:16px;border-radius:50%;background:var(--pac);box-shadow:0 0 6px var(--pac);display:inline-block;';
    el.appendChild(s);
  }
}

const overlay = document.getElementById('overlay');
function showOverlay(title, sub, btn) {
  document.querySelector('#overlay h1').textContent = title;
  document.getElementById('ov-title').textContent = sub;
  document.getElementById('ov-sub').style.display = 'none';
  document.getElementById('startBtn').textContent = btn || 'START';
  overlay.classList.remove('hidden');
}
function hideOverlay() { overlay.classList.add('hidden'); }

// ============================================================
//  UPDATE
// ============================================================
function update() {
  S.frame++;

  if (S.state === 'ready') {
    S.readyTimer--;
    if (S.readyTimer <= 0) S.state = 'playing';
    return;
  }
  if (S.state === 'dying') {
    S.deathTimer--;
    if (S.deathTimer <= 0) afterDeath();
    return;
  }
  if (S.state === 'levelclear') {
    S.clearTimer--;
    if (S.clearTimer <= 0) nextLevel();
    return;
  }
  if (S.state !== 'playing') return;

  // frightened timer
  if (S.frightTimer > 0) {
    S.frightTimer--;
    if (S.frightTimer === 0) endFright();
  }

  updatePac();
  updateGhosts();
  checkCollisions();
}

// ---- Pac-Man movement ----
// Shared center-aligned movement. Each entity moves tile-center to tile-center.
// The target center is computed dynamically from the entity's position relative
// to its current tile center, and each step is clamped so the entity lands
// EXACTLY on a center at ANY speed. (The old exact-0.01 snap only triggered for
// integer speeds, so the 1.8px ghosts never re-decided direction -> they ran
// straight through walls and never chased; the side-tunnel wrap also misfired.)
function stepEntity(e, opts) {
  const { col, row } = tileOf(e.x, e.y);
  const center = tileCenter(col, row);
  const atCenter = Math.abs(e.x - center.x) < 0.01 && Math.abs(e.y - center.y) < 0.01;

  if (atCenter) {
    if (opts.chooseDir) opts.chooseDir(e, col, row);
    else if (canStep(col, row, e.nextDir, false, false)) e.dir = e.nextDir;
    if (!canStep(col, row, e.dir, opts.isGhost, opts.exitingHouse)) return; // blocked
  }

  const d = DIRS[e.dir];
  let nx = e.x, ny = e.y;
  if (d.x > 0) {
    const tx = (e.x < center.x) ? center.x : tileCenter(col + 1, row).x;
    nx = e.x + opts.speed;
    if (nx > tx) nx = tx;
  } else if (d.x < 0) {
    const tx = (e.x > center.x) ? center.x : tileCenter(col - 1, row).x;
    nx = e.x - opts.speed;
    if (nx < tx) nx = tx;
  }
  if (d.y > 0) {
    const ty = (e.y < center.y) ? center.y : tileCenter(col, row + 1).y;
    ny = e.y + opts.speed;
    if (ny > ty) ny = ty;
  } else if (d.y < 0) {
    const ty = (e.y > center.y) ? center.y : tileCenter(col, row - 1).y;
    ny = e.y - opts.speed;
    if (ny < ty) ny = ty;
  }
  e.x = nx; e.y = ny;

  // side tunnel wrap (middle row)
  if (e.x < 0) e.x += W;
  else if (e.x > W) e.x -= W;
}

function updatePac() {
  const p = pac;
  stepEntity(p, { isGhost: false, speed: p.speed });

  // mouth animation
  p.mouth += 0.25 * p.mouthDir;
  if (p.mouth > 0.9) { p.mouth = 0.9; p.mouthDir = -1; }
  if (p.mouth < 0.1) { p.mouth = 0.1; p.mouthDir = 1; }

  // eat dot
  const tc = tileOf(p.x, p.y);
  const cell = tileAt(tc.col, tc.row);
  if (cell === DOT) {
    maze[tc.row][tc.col] = EMPTY;
    S.score += 10;
    S.dotsLeft--;
    sfx.waka();
    maybeExtraLife();
    updateHUD();
    if (S.dotsLeft <= 0) levelClear();
  } else if (cell === POWER) {
    maze[tc.row][tc.col] = EMPTY;
    S.score += 50;
    S.dotsLeft--;
    startFright();
    sfx.power();
    maybeExtraLife();
    updateHUD();
    if (S.dotsLeft <= 0) levelClear();
  }
}

let extraLifeGiven = false;
function maybeExtraLife() {
  if (!extraLifeGiven && S.score >= 10000) {
    S.lives++;
    extraLifeGiven = true;
    sfx.extraLife();
    updateHUD();
  }
}

function startFright() {
  S.frightTimer = Math.max(60, 480 - (S.level - 1) * 60);
  S.ghostEatenChain = 0;
  for (const g of ghosts) {
    if (g.mode === 'eyes') continue;
    g.mode = 'fright';
    // reverse direction
    g.dir = OPPOSITE[g.dir];
  }
}
function endFright() {
  for (const g of ghosts) {
    if (g.mode === 'fright') g.mode = 'chase';
  }
}

// ---- Ghost AI ----
function updateGhosts() {
  for (const g of ghosts) {
    g.bob += 0.2;
    if (g.mode === 'eyes') { updateEyes(g); continue; }
    if (g.mode === 'house') { updateHouse(g); continue; }
    stepEntity(g, { isGhost: true, speed: ghostSpeed(g), chooseDir: (e, c, r) => chooseGhostDir(e, c, r) });
  }
}

function ghostSpeed(g) {
  let base = 1.8 + (S.level - 1) * 0.15;
  if (g.mode === 'fright') base *= 0.7;
  if (g.mode === 'eyes') base *= 2.0;
  return Math.min(base, 3.2);
}

function chooseGhostDir(g, col, row) {
  // options: up, left, right, down — never reverse
  const opts = DIR_KEYS.filter(d => d !== OPPOSITE[g.dir] && canStep(col, row, d, true, false));
  if (opts.length === 0) {
    g.dir = OPPOSITE[g.dir];
    return;
  }
  if (g.mode === 'fright') {
    g.dir = opts[Math.floor(Math.random() * opts.length)];
    return;
  }
  const target = ghostTarget(g);
  let best = opts[0], bestDist = Infinity;
  for (const d of opts) {
    const nd = DIRS[d];
    const nc = col + nd.x, nr = row + nd.y;
    const dist = (nc - target.col) ** 2 + (nr - target.row) ** 2;
    if (dist < bestDist) { bestDist = dist; best = d; }
  }
  g.dir = best;
}

function ghostTarget(g) {
  const p = tileOf(pac.x, pac.y);
  const pd = DIRS[pac.dir];
  switch (g.name) {
    case 'blinky':
      return p; // direct chase
    case 'pinky':
      return { col: p.col + pd.x * 4, row: p.row + pd.y * 4 }; // ambush ahead
    case 'inky': {
      const b = ghosts[0];
      const bt = tileOf(b.x, b.y);
      const ax = p.col + pd.x * 2, ay = p.row + pd.y * 2;
      return { col: bt.col + (ax - bt.col) * 2, row: bt.row + (ay - bt.row) * 2 };
    }
    case 'clyde': {
      const b = tileOf(g.x, g.y);
      const dist = (b.col - p.col) ** 2 + (b.row - p.row) ** 2;
      return dist > 64 ? p : { col: 0, row: ROWS - 1 }; // shy when close
    }
  }
  return p;
}

// Ghost house: bounce up/down, then exit through door
function updateHouse(g) {
  g.releaseTimer--;
  const { col, row } = tileOf(g.x, g.y);
  const center = tileCenter(col, row);
  // bounce vertically inside house
  g.y += (g.dir === 'up' ? -1 : 1) * 1.2;
  // keep within house rows 13-15
  if (g.y < tileCenter(13, 13).y) { g.y = tileCenter(13, 13).y; g.dir = 'down'; }
  if (g.y > tileCenter(13, 15).y) { g.y = tileCenter(13, 15).y; g.dir = 'up'; }
  g.x = center.x;

  if (g.releaseTimer <= 0) {
    // move to door then exit
    g.x = tileCenter(DOOR_TILE.col, DOOR_TILE.row).x;
    g.y = tileCenter(DOOR_TILE.col, DOOR_TILE.row).y;
    g.dir = 'up';
    g.mode = 'chase';
  }
}

// Eyes returning to house: steer toward the house center, re-enter via the door
function updateEyes(g) {
  stepEntity(g, {
    isGhost: true,
    speed: ghostSpeed(g),
    chooseDir: (e, col, row) => {
      const target = { col: 13, row: 14 }; // house center
      const opts = DIR_KEYS.filter(d => canStep(col, row, d, true, true));
      if (!opts.length) return;
      let best = opts[0], bestDist = Infinity;
      for (const d of opts) {
        const nd = DIRS[d];
        const dist = (col + nd.x - target.col) ** 2 + (row + nd.y - target.row) ** 2;
        if (dist < bestDist) { bestDist = dist; best = d; }
      }
      e.dir = best;
    },
  });

  // reached house interior -> back into house
  const tc = tileOf(g.x, g.y);
  if (tc.col >= 11 && tc.col <= 16 && tc.row >= 13 && tc.row <= 15) {
    g.x = tileCenter(13, 14).x;
    g.y = tileCenter(13, 14).y;
    g.mode = 'house';
    g.releaseTimer = 30;
    g.dir = 'up';
  }
}

// ---- Collisions ----
function checkCollisions() {
  const p = tileOf(pac.x, pac.y);
  for (const g of ghosts) {
    const gt = tileOf(g.x, g.y);
    // pixel distance for fairness
    const dx = pac.x - g.x, dy = pac.y - g.y;
    if (dx * dx + dy * dy > (TILE * 0.7) ** 2) continue;

    if (g.mode === 'fright') {
      // eat ghost
      const pts = [200, 400, 800, 1600][Math.min(S.ghostEatenChain, 3)];
      S.ghostEatenChain++;
      S.score += pts;
      sfx.eatGhost();
      g.mode = 'eyes';
      updateHUD();
    } else if (g.mode !== 'eyes') {
      loseLife();
      return;
    }
  }
}

// ============================================================
//  RENDER
// ============================================================
function render() {
  ctx.clearRect(0, 0, W, H);
  drawMaze();
  if (S.state === 'menu') return;
  drawDots();
  if (S.state !== 'dying' || S.deathTimer > 60) drawPac();
  drawGhosts();
  drawStateText();
}

function drawMaze() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const t = MAZE[r][c];
      const x = c * TILE, y = r * TILE;
      if (t === WALL) {
        drawWallCell(x, y, c, r);
      } else if (t === DOOR) {
        ctx.fillStyle = '#ffb8de';
        ctx.fillRect(x, y + TILE / 2 - 2, TILE, 4);
      }
    }
  }
}

function drawWallCell(x, y, c, r) {
  // draw rounded wall segments: fill if this is a wall and neighbor below/right is not wall
  ctx.strokeStyle = C.wall;
  ctx.lineWidth = 2;
  ctx.shadowColor = C.wall;
  ctx.shadowBlur = 6;
  const inset = 3;
  // Draw as a rounded rect border only on exposed edges
  const top = r > 0 ? MAZE[r - 1][c] : WALL;
  const bottom = r < ROWS - 1 ? MAZE[r + 1][c] : WALL;
  const left = c > 0 ? MAZE[r][c - 1] : WALL;
  const right = c < COLS - 1 ? MAZE[r][c + 1] : WALL;
  ctx.beginPath();
  const ix = x + inset, iy = y + inset, s = TILE - inset * 2;
  // draw lines on exposed sides
  if (top === WALL || top === DOOR) {} else { ctx.moveTo(ix, iy); ctx.lineTo(ix + s, iy); }
  if (bottom === WALL || bottom === DOOR) {} else { ctx.moveTo(ix, iy + s); ctx.lineTo(ix + s, iy + s); }
  if (left === WALL || left === DOOR) {} else { ctx.moveTo(ix, iy); ctx.lineTo(ix, iy + s); }
  if (right === WALL || right === DOOR) {} else { ctx.moveTo(ix + s, iy); ctx.lineTo(ix + s, iy + s); }
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawDots() {
  ctx.fillStyle = C.dot;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const t = maze[r][c];
      const cx = c * TILE + TILE / 2, cy = r * TILE + TILE / 2;
      if (t === DOT) {
        ctx.beginPath();
        ctx.arc(cx, cy, 2.2, 0, Math.PI * 2);
        ctx.fill();
      } else if (t === POWER) {
        const pulse = 4 + Math.sin(S.frame * 0.2) * 1.5;
        ctx.shadowColor = C.dot;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(cx, cy, pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
  }
}

function drawPac() {
  const p = pac;
  const r = TILE * 0.45;
  let angle = 0;
  if (p.dir === 'left') angle = Math.PI;
  else if (p.dir === 'up') angle = -Math.PI / 2;
  else if (p.dir === 'down') angle = Math.PI / 2;
  const mouth = p.mouth * 0.5;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(angle);
  ctx.fillStyle = C.pac;
  ctx.shadowColor = C.pac;
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, r, mouth, Math.PI * 2 - mouth);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  ctx.shadowBlur = 0;
}

function drawGhosts() {
  for (const g of ghosts) {
    drawGhost(g);
  }
}

function drawGhost(g) {
  const r = TILE * 0.48;
  const x = g.x, y = g.y + Math.sin(g.bob) * 1.5;
  let body = g.hex;
  let isFright = g.mode === 'fright';
  let isEyes = g.mode === 'eyes';
  // flash white when about to be eaten
  if (isFright && S.frightTimer < 120 && Math.floor(S.frame / 8) % 2 === 0) body = '#fff';

  ctx.save();
  if (!isEyes) {
    ctx.fillStyle = isFright ? (body === '#fff' ? '#fff' : C.fright) : body;
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 8;
    // body: top dome + wavy bottom
    ctx.beginPath();
    ctx.arc(x, y, r, Math.PI, 0);
    ctx.lineTo(x + r, y + r);
    // wavy feet
    const waves = 4;
    const ww = (r * 2) / waves;
    for (let i = 0; i < waves; i++) {
      const wx = x + r - ww * (i + 0.5);
      ctx.lineTo(wx, y + r - 3);
      ctx.lineTo(x + r - ww * (i + 1), y + r);
    }
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  // eyes
  const ed = DIRS[g.dir];
  const ex = ed.x * 2, ey = ed.y * 2;
  const eyeColor = isFright ? '#fff' : '#fff';
  const pupilColor = isFright ? '#000' : (g.mode === 'eyes' ? '#00f' : '#00f');
  for (const side of [-1, 1]) {
    const ecx = x + side * r * 0.4 + ex;
    const ecy = y - r * 0.1 + ey;
    ctx.fillStyle = eyeColor;
    ctx.beginPath();
    ctx.ellipse(ecx, ecy, r * 0.28, r * 0.34, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = pupilColor;
    ctx.beginPath();
    ctx.arc(ecx + ed.x * 2, ecy + ed.y * 2, r * 0.14, 0, Math.PI * 2);
    ctx.fill();
  }
  // frightened face
  if (isFright) {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y + r * 0.4, r * 0.5, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawStateText() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (S.state === 'ready') {
    ctx.fillStyle = C.pac;
    ctx.font = 'bold 24px "Courier New", monospace';
    ctx.shadowColor = C.pac;
    ctx.shadowBlur = 10;
    ctx.fillText('READY!', W / 2, tileCenter(13, 17).y);
    ctx.shadowBlur = 0;
  } else if (S.state === 'levelclear') {
    // flash the maze
    if (Math.floor(S.frame / 6) % 2 === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(0, 0, W, H);
    }
  } else if (S.state === 'paused') {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 28px "Courier New", monospace';
    ctx.fillText('PAUSED', W / 2, H / 2);
  }
}

// ============================================================
//  MAIN LOOP
// ============================================================
function loop() {
  if (S.state !== 'paused') update();
  render();
  requestAnimationFrame(loop);
}

// init
resetMaze();
countDots();
pac = makePac();
ghosts = makeGhosts();
updateHUD();
loop();
</script>
</body>
</html>
